<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">进程 P1 的页表</title>
  <desc id="desc">页号 0、1、2、3 分别对应物理块号 1、6、3、8。</desc>
  <style>
    .box { fill: #ffffff; stroke: #64748b; stroke-width: 3; }
    .line { stroke: #64748b; stroke-width: 3; }
    .head { fill: #e8eef7; }
    .focus { fill: #fff3cd; }
    .label { fill: #172033; font: 600 28px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .number { fill: #172033; font: 500 30px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #111827; stroke: #94a3b8; }
      .line { stroke: #94a3b8; }
      .head { fill: #263449; }
      .focus { fill: #57451d; }
      .label, .number { fill: #f8fafc; }
    }
  </style>

  <rect class="box" x="72" y="35" width="576" height="400" rx="4"/>
  <rect class="head" x="74" y="37" width="572" height="78"/>
  <rect class="focus" x="74" y="195" width="572" height="80"/>

  <line class="line" x1="360" y1="35" x2="360" y2="435"/>
  <line class="line" x1="72" y1="115" x2="648" y2="115"/>
  <line class="line" x1="72" y1="195" x2="648" y2="195"/>
  <line class="line" x1="72" y1="275" x2="648" y2="275"/>
  <line class="line" x1="72" y1="355" x2="648" y2="355"/>

  <text class="label" x="216" y="86" text-anchor="middle">页号</text>
  <text class="label" x="504" y="86" text-anchor="middle">物理块号</text>

  <text class="number" x="216" y="168" text-anchor="middle">0</text>
  <text class="number" x="504" y="168" text-anchor="middle">1</text>
  <text class="number" x="216" y="248" text-anchor="middle">1</text>
  <text class="number" x="504" y="248" text-anchor="middle">6</text>
  <text class="number" x="216" y="328" text-anchor="middle">2</text>
  <text class="number" x="504" y="328" text-anchor="middle">3</text>
  <text class="number" x="216" y="408" text-anchor="middle">3</text>
  <text class="number" x="504" y="408" text-anchor="middle">8</text>
</svg>
