<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">OSI 和 TCP/IP 体系结构</title>
  <desc id="desc">OSI 七层模型与 TCP/IP 四层模型的对应关系</desc>
  <style>
    .title { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #555; }
    .layer { font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #222; }
    .number { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #555; }
    .detail { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #444; }
    .front { fill: #fff; stroke: #333; stroke-width: 1.8; }
  </style>

  <rect width="1000" height="560" fill="#fff"/>

  <g transform="translate(120 35)">
    <rect class="front" x="0" y="0" width="320" height="60"/>
    <rect class="front" x="0" y="60" width="320" height="60"/>
    <rect class="front" x="0" y="120" width="320" height="60"/>
    <rect class="front" x="0" y="180" width="320" height="60"/>
    <rect class="front" x="0" y="240" width="320" height="60"/>
    <rect class="front" x="0" y="300" width="320" height="60"/>
    <rect class="front" x="0" y="360" width="320" height="60"/>

    <text class="number" x="32" y="38">7</text>
    <text class="layer" x="180" y="38" text-anchor="middle">应用层</text>
    <text class="number" x="32" y="98">6</text>
    <text class="layer" x="180" y="98" text-anchor="middle">表示层</text>
    <text class="number" x="32" y="158">5</text>
    <text class="layer" x="180" y="158" text-anchor="middle">会话层</text>
    <text class="number" x="32" y="218">4</text>
    <text class="layer" x="180" y="218" text-anchor="middle">传输层</text>
    <text class="number" x="32" y="278">3</text>
    <text class="layer" x="180" y="278" text-anchor="middle">网络层</text>
    <text class="number" x="32" y="338">2</text>
    <text class="layer" x="180" y="338" text-anchor="middle">数据链路层</text>
    <text class="number" x="32" y="398">1</text>
    <text class="layer" x="180" y="398" text-anchor="middle">物理层</text>
  </g>

  <g transform="translate(445 35)">
    <rect class="front" x="0" y="0" width="290" height="180"/>
    <rect class="front" x="0" y="180" width="290" height="60"/>
    <rect class="front" x="0" y="240" width="290" height="60"/>
    <rect class="front" x="0" y="300" width="290" height="120"/>

    <text class="layer" x="145" y="48" text-anchor="middle">应用层</text>
    <text class="detail" x="145" y="88" text-anchor="middle">各种应用层协议</text>
    <text class="detail" x="145" y="119" text-anchor="middle">TELNET、FTP、SMTP 等</text>
    <text class="layer" x="145" y="218" text-anchor="middle">传输层（TCP 或 UDP）</text>
    <text class="layer" x="145" y="278" text-anchor="middle">网际层（IP）</text>
    <text class="layer" x="145" y="366" text-anchor="middle">网络接口层</text>
  </g>

  <text class="title" x="280" y="500" text-anchor="middle">OSI 的体系结构</text>
  <text class="title" x="590" y="500" text-anchor="middle">TCP/IP 的体系结构</text>
</svg>
